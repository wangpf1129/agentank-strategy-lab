<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <style>
    .blade-aura {
      transform-origin: 256px 266px;
      transform-box: view-box;
      animation: auraDrift 8s linear infinite;
    }
    .lotus-core {
      animation: lotusBreath 3s ease-in-out infinite;
    }
    .thunder {
      animation: thunderPulse 1.25s steps(2, end) infinite;
    }
    .thunder.alt {
      animation-delay: .42s;
    }
    .thunder.alt2 {
      animation-delay: .84s;
    }
    @keyframes auraDrift {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes lotusBreath {
      0%, 100% { opacity: .92; }
      50% { opacity: 1; }
    }
    @keyframes thunderPulse {
      0%, 100% { opacity: .26; }
      12% { opacity: 1; }
      24% { opacity: .42; }
      44% { opacity: .82; }
      64% { opacity: .3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blade-aura, .lotus-core, .thunder {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="softAura" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#d7fff2" stop-opacity=".42"/>
      <stop offset="62%" stop-color="#1bc6aa" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06231f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="46%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#eaffda"/>
      <stop offset="38%" stop-color="#48d6af"/>
      <stop offset="72%" stop-color="#077568"/>
      <stop offset="100%" stop-color="#031713"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#d8fff1"/>
      <stop offset="38%" stop-color="#21c7a8"/>
      <stop offset="76%" stop-color="#07564b"/>
      <stop offset="100%" stop-color="#031713"/>
    </linearGradient>
    <linearGradient id="bambooGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e7ffd5"/>
      <stop offset="38%" stop-color="#7fd263"/>
      <stop offset="100%" stop-color="#143a22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="50%" stop-color="#d7a82f"/>
      <stop offset="100%" stop-color="#6f4a0a"/>
    </linearGradient>
    <linearGradient id="thunderGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8bf"/>
      <stop offset="46%" stop-color="#9dffe5"/>
      <stop offset="100%" stop-color="#d7a82f"/>
    </linearGradient>
    <filter id="shadow" x="-22%" y="-22%" width="144%" height="144%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001814" flood-opacity=".56"/>
    </filter>
    <filter id="jadeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 1 0 0 0.86 0 0 1 0 0.72 0 0 0 .78 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="thunderGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.86 0 1 0 0 0.75 0 0 1 0 0.36 0 0 0 .85 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="swordPetal">
      <path d="M256 84 C278 139 286 205 256 266 C226 205 234 139 256 84 Z" fill="url(#bladeGrad)" stroke="#06231f" stroke-width="7"/>
      <path d="M256 104 C267 154 268 202 256 244 C244 202 245 154 256 104 Z" fill="#e5fff8" opacity=".38"/>
      <path d="M256 84 L266 134 L256 266 L246 134 Z" fill="#ffffff" opacity=".12"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="232" fill="url(#softAura)"/>

  <g class="blade-aura" fill="none" stroke="#8dffe1" stroke-width="4" stroke-linecap="round" stroke-opacity=".42" filter="url(#jadeGlow)">
    <path d="M132 252 C151 162 211 118 256 112"/>
    <path d="M380 252 C361 162 301 118 256 112"/>
    <path d="M132 280 C151 370 211 414 256 420"/>
    <path d="M380 280 C361 370 301 414 256 420"/>
  </g>

  <g class="lotus-core" filter="url(#shadow)">
    <use href="#swordPetal" transform="rotate(0 256 266)"/>
    <use href="#swordPetal" transform="rotate(45 256 266)"/>
    <use href="#swordPetal" transform="rotate(90 256 266)"/>
    <use href="#swordPetal" transform="rotate(135 256 266)"/>
    <use href="#swordPetal" transform="rotate(180 256 266)"/>
    <use href="#swordPetal" transform="rotate(225 256 266)"/>
    <use href="#swordPetal" transform="rotate(270 256 266)"/>
    <use href="#swordPetal" transform="rotate(315 256 266)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M256 176 L344 228 L344 304 L256 356 L168 304 L168 228 Z" fill="#03120f" stroke="#020807" stroke-width="10" stroke-linejoin="round"/>
    <path d="M256 203 L318 239 L318 293 L256 329 L194 293 L194 239 Z" fill="#0b8f78" stroke="#0b3b35" stroke-width="7" stroke-linejoin="round"/>
    <path d="M256 221 L300 246 L300 286 L256 312 L212 286 L212 246 Z" fill="#06231f" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M214 246 L256 222 L298 246" fill="none" stroke="#e5fff8" stroke-width="4" stroke-linecap="round" opacity=".36"/>
    <path d="M214 286 L256 310 L298 286" fill="none" stroke="#0fd8b6" stroke-width="4" stroke-linecap="round" opacity=".42"/>
  </g>

  <g filter="url(#jadeGlow)">
    <path d="M224 205 C238 192 274 192 288 205 L276 246 H236 Z" fill="#061d1a" stroke="#d7a82f" stroke-width="6"/>
    <rect x="238" y="72" width="36" height="172" rx="13" fill="url(#bambooGrad)" stroke="#032015" stroke-width="7"/>
    <path d="M242 109 H270 M242 151 H270 M242 193 H270" stroke="#e7ffd5" stroke-width="4" stroke-linecap="round" opacity=".74"/>
    <rect x="247" y="55" width="18" height="36" rx="6" fill="#163d24" stroke="#e7ffd5" stroke-width="4"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="256" cy="266" r="26" fill="#08231f" stroke="url(#goldGrad)" stroke-width="6" filter="url(#jadeGlow)"/>
    <path d="M256 246 L276 266 L256 286 L236 266 Z" fill="#0fd8b6" stroke="#e5fff8" stroke-width="5" opacity=".94"/>
  </g>

  <g fill="none" stroke="url(#thunderGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#thunderGlow)" opacity=".82">
    <path class="thunder" d="M181 226 L202 218 L196 238 L221 229" stroke-width="4"/>
    <path class="thunder alt" d="M330 224 L310 237 L335 240 L316 257" stroke-width="4"/>
    <path class="thunder alt2" d="M184 306 L207 294 L199 316 L224 305" stroke-width="4"/>
    <path class="thunder alt" d="M329 307 L306 296 L316 318 L291 306" stroke-width="4"/>
    <path class="thunder" d="M274 254 L263 264 L278 266 L264 279" stroke-width="3"/>
  </g>
</svg>

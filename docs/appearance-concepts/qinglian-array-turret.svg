<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <style>
    .sword-ring {
      transform-origin: 256px 256px;
      transform-box: view-box;
      animation: swordSpin 5.8s linear infinite;
    }
    .inner-ring {
      transform-origin: 256px 256px;
      transform-box: view-box;
      animation: ringDrift 9s linear infinite reverse;
    }
    .lotus-ring {
      transform-origin: 256px 270px;
      transform-box: view-box;
      animation: lotusPulse 3.6s ease-in-out infinite;
    }
    .aura {
      animation: auraBreath 2.8s ease-in-out infinite;
    }
    .rune {
      animation: runePulse 1.8s ease-in-out infinite;
    }
    .thunder-ring {
      transform-origin: 256px 270px;
      transform-box: view-box;
      animation: thunderSpin 7.2s linear infinite;
    }
    .thunder-bolt {
      animation: thunderFlicker 1.35s steps(2, end) infinite;
    }
    .thunder-bolt.alt {
      animation-delay: .45s;
    }
    .thunder-bolt.alt2 {
      animation-delay: .9s;
    }
    .core-thunder {
      animation: coreThunder 1.15s ease-in-out infinite;
    }
    @keyframes swordSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringDrift {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes lotusPulse {
      0%, 100% { opacity: .86; }
      50% { opacity: 1; }
    }
    @keyframes auraBreath {
      0%, 100% { opacity: .28; }
      50% { opacity: .76; }
    }
    @keyframes runePulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    @keyframes thunderSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes thunderFlicker {
      0%, 100% { opacity: .42; }
      8% { opacity: 1; }
      15% { opacity: .5; }
      23% { opacity: .86; }
      31% { opacity: .38; }
      60% { opacity: .68; }
    }
    @keyframes coreThunder {
      0%, 100% { opacity: .54; }
      18% { opacity: 1; }
      30% { opacity: .58; }
      48% { opacity: .9; }
      62% { opacity: .48; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sword-ring, .inner-ring, .lotus-ring, .aura, .rune, .thunder-ring, .thunder-bolt, .core-thunder {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="arrayGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#d7fff2" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#18c6a6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06231f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lotusCore" cx="48%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#eaffda"/>
      <stop offset="38%" stop-color="#4bd4ae"/>
      <stop offset="72%" stop-color="#087b6b"/>
      <stop offset="100%" stop-color="#031713"/>
    </radialGradient>
    <linearGradient id="jadeSteel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#caffed"/>
      <stop offset="38%" stop-color="#18b18f"/>
      <stop offset="74%" stop-color="#07564b"/>
      <stop offset="100%" stop-color="#041816"/>
    </linearGradient>
    <linearGradient id="bambooGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e7ffd5"/>
      <stop offset="38%" stop-color="#78c85f"/>
      <stop offset="100%" stop-color="#143a22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="48%" stop-color="#d7a82f"/>
      <stop offset="100%" stop-color="#6f4a0a"/>
    </linearGradient>
    <linearGradient id="thunderGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8bf"/>
      <stop offset="45%" stop-color="#8dffe1"/>
      <stop offset="100%" stop-color="#d7a82f"/>
    </linearGradient>
    <filter id="jadeGlow" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 1 0 0 0.85 0 0 1 0 0.72 0 0 0 .78 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001814" flood-opacity=".55"/>
    </filter>
    <filter id="thunderGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9 0 1 0 0 0.75 0 0 1 0 0.35 0 0 0 .85 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="flyingSword">
      <path d="M256 42 L274 91 L262 174 L256 202 L250 174 L238 91 Z" fill="url(#jadeSteel)" stroke="#dffff5" stroke-width="3"/>
      <path d="M256 49 L264 94 L256 173 L248 94 Z" fill="#f2fff8" opacity=".58"/>
      <path d="M229 184 H283 L270 202 H242 Z" fill="url(#goldGrad)" stroke="#3b2705" stroke-width="3"/>
      <rect x="248" y="199" width="16" height="43" rx="6" fill="#15382d" stroke="#d7a82f" stroke-width="3"/>
      <path d="M256 239 L269 254 L256 268 L243 254 Z" fill="#16d8b8" stroke="#e5fff8" stroke-width="3"/>
    </g>
    <g id="lotusPetal">
      <path d="M256 145 C290 184 300 229 256 270 C212 229 222 184 256 145 Z" fill="url(#lotusCore)" stroke="#06231f" stroke-width="7"/>
      <path d="M256 164 C276 194 278 226 256 251 C234 226 236 194 256 164 Z" fill="#d7fff2" opacity=".35"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="236" fill="url(#arrayGlow)" class="aura"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#0fd8b6" stroke-width="4" stroke-opacity=".55" stroke-dasharray="18 14" filter="url(#jadeGlow)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#d7a82f" stroke-width="3" stroke-opacity=".62" stroke-dasharray="5 16"/>

  <g class="sword-ring" filter="url(#jadeGlow)">
    <use href="#flyingSword"/>
    <use href="#flyingSword" transform="rotate(45 256 256)"/>
    <use href="#flyingSword" transform="rotate(90 256 256)"/>
    <use href="#flyingSword" transform="rotate(135 256 256)"/>
    <use href="#flyingSword" transform="rotate(180 256 256)"/>
    <use href="#flyingSword" transform="rotate(225 256 256)"/>
    <use href="#flyingSword" transform="rotate(270 256 256)"/>
    <use href="#flyingSword" transform="rotate(315 256 256)"/>
  </g>

  <g class="inner-ring" fill="none" stroke-linecap="round" filter="url(#jadeGlow)">
    <path d="M256 104 C333 104 408 179 408 256" stroke="#b8ffe5" stroke-width="5" stroke-opacity=".55"/>
    <path d="M408 256 C408 333 333 408 256 408" stroke="#d7a82f" stroke-width="4" stroke-opacity=".5"/>
    <path d="M256 408 C179 408 104 333 104 256" stroke="#b8ffe5" stroke-width="5" stroke-opacity=".55"/>
    <path d="M104 256 C104 179 179 104 256 104" stroke="#d7a82f" stroke-width="4" stroke-opacity=".5"/>
  </g>

  <g class="rune" fill="#d7a82f" stroke="#3b2705" stroke-width="2">
    <path d="M256 86 L268 108 L256 130 L244 108 Z"/>
    <path d="M426 256 L404 268 L382 256 L404 244 Z"/>
    <path d="M256 426 L244 404 L256 382 L268 404 Z"/>
    <path d="M86 256 L108 244 L130 256 L108 268 Z"/>
  </g>

  <g class="thunder-ring" fill="none" stroke="url(#thunderGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#thunderGlow)">
    <path class="thunder-bolt" d="M151 190 L178 178 L168 209 L204 194 L185 230" stroke-width="7"/>
    <path class="thunder-bolt alt" d="M360 169 L336 195 L368 188 L345 225 L385 207" stroke-width="6"/>
    <path class="thunder-bolt alt2" d="M399 306 L365 318 L390 333 L351 351 L378 364" stroke-width="7"/>
    <path class="thunder-bolt alt" d="M154 348 L184 332 L170 365 L211 344 L194 383" stroke-width="6"/>
  </g>

  <g class="lotus-ring" filter="url(#shadow)">
    <use href="#lotusPetal" transform="rotate(0 256 270)"/>
    <use href="#lotusPetal" transform="rotate(45 256 270)"/>
    <use href="#lotusPetal" transform="rotate(90 256 270)"/>
    <use href="#lotusPetal" transform="rotate(135 256 270)"/>
    <use href="#lotusPetal" transform="rotate(180 256 270)"/>
    <use href="#lotusPetal" transform="rotate(225 256 270)"/>
    <use href="#lotusPetal" transform="rotate(270 256 270)"/>
    <use href="#lotusPetal" transform="rotate(315 256 270)"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="256" cy="270" r="103" fill="#041411" stroke="#020807" stroke-width="10"/>
    <circle cx="256" cy="270" r="81" fill="url(#lotusCore)" stroke="#0b3b35" stroke-width="7"/>
    <circle cx="256" cy="270" r="61" fill="#06231f" stroke="#d7a82f" stroke-width="6" opacity=".92"/>
    <path d="M198 270 H314" stroke="#e5fff8" stroke-width="5" stroke-linecap="round" opacity=".42"/>
    <path d="M256 209 V331" stroke="#b8ffe5" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <circle cx="256" cy="270" r="38" fill="#08231f" stroke="#d7a82f" stroke-width="7" filter="url(#jadeGlow)"/>
    <circle cx="256" cy="270" r="20" fill="#0fd8b6" stroke="#e5fff8" stroke-width="5" opacity=".94"/>
    <path d="M256 247 L279 270 L256 293 L233 270 Z" fill="#fff0a6" opacity=".48"/>
    <g class="core-thunder" fill="none" stroke="url(#thunderGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#thunderGlow)">
      <path d="M232 252 L247 246 L241 262 L259 255" stroke-width="5"/>
      <path d="M279 254 L265 264 L281 267 L265 282" stroke-width="5"/>
      <path d="M245 293 L258 280 L254 300 L274 287" stroke-width="4"/>
    </g>
  </g>

  <g filter="url(#jadeGlow)">
    <rect x="238" y="70" width="36" height="178" rx="13" fill="url(#bambooGrad)" stroke="#032015" stroke-width="7"/>
    <path d="M242 107 H270 M242 150 H270 M242 193 H270" stroke="#e7ffd5" stroke-width="4" stroke-linecap="round" opacity=".74"/>
    <rect x="247" y="53" width="18" height="36" rx="6" fill="#163d24" stroke="#e7ffd5" stroke-width="4"/>
  </g>
</svg>
